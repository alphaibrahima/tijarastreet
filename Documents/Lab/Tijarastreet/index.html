<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tijara Street — Bientôt disponible</title>
    <meta name="description" content="Tijara Street est en cours de construction. Inscrivez-vous pour être notifié dès le lancement.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background -->
    <div class="bg-glow bg-glow--green"></div>
    <div class="bg-glow bg-glow--red"></div>

    <main class="container">

        <!-- Logo -->
        <header class="logo">
            <img src="img/logo.jpeg" alt="Tijara Street" class="logo__img">
            <span class="logo__name">TIJARA <span class="logo__accent">STREET</span></span>
        </header>

        <!-- Heading -->
        <h1 class="heading">
            Quelque chose de grand<br>
            <span class="heading__highlight">arrive bientôt.</span>
        </h1>

        <!-- Sub -->
        <p class="sub">
            Nous préparons la première infrastructure d'intelligence artificielle souveraine du Maroc.<br>
            Laissez-nous votre e-mail pour être parmi les premiers informés.
        </p>

        <!-- Form -->
        <form id="notify-form" class="form" action="https://formspree.io/f/xzdwnole" method="POST">
            <div class="form__field">
                <svg class="form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                <input
                    type="email"
                    name="email"
                    id="email-input"
                    class="form__input"
                    placeholder="Votre adresse e-mail"
                    required
                    autocomplete="email"
                >
            </div>
            <button type="submit" id="submit-btn" class="form__btn">
                <span id="btn-text">Me notifier</span>
                <svg class="form__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>

        <!-- Message feedback -->
        <p id="form-message" class="form__message" aria-live="polite"></p>

        <!-- Countdown -->
        <div class="countdown" id="countdown-anchor">
            <div class="countdown__block">
                <span class="countdown__num" id="days">00</span>
                <span class="countdown__lbl">Jours</span>
            </div>
            <span class="countdown__sep">:</span>
            <div class="countdown__block">
                <span class="countdown__num" id="hours">00</span>
                <span class="countdown__lbl">Heures</span>
            </div>
            <span class="countdown__sep">:</span>
            <div class="countdown__block">
                <span class="countdown__num" id="minutes">00</span>
                <span class="countdown__lbl">Min</span>
            </div>
            <span class="countdown__sep">:</span>
            <div class="countdown__block">
                <span class="countdown__num" id="seconds">00</span>
                <span class="countdown__lbl">Sec</span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>🇲🇦 Du Maroc vers le monde</span>
            <span class="footer__sep">·</span>
            <span>© 2026 Tijara Street</span>
        </footer>

    </main>

    <script src="app.js"></script>
</body>
</html>
