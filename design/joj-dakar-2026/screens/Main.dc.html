<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #457D1F; text-decoration: underline; }
    a:hover { color: #2F5A15; }
  </style>
</helmet>

<div class="root" style="width:390px;height:844px;background:#FAF7F0;display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:28px 20px 8px;display:flex;flex-direction:column;gap:20px;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:28px;height:28px;border-radius:8px;background:#1C1B17;display:flex;align-items:center;justify-content:center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FAF7F0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"/><path d="M5 8h14l-1.4 9.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 12h6"/></svg>
        </div>
        <span style="font-size:12px;font-weight:700;letter-spacing:0.04em;color:#1C1B17;">JOJ DAKAR 2026</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="display:flex;background:#EFEBE0;border-radius:999px;padding:3px;">
          <span style="font-size:11px;font-weight:700;color:#FFFFFF;background:#1C1B17;border-radius:999px;padding:5px 10px;">FR</span>
          <span style="font-size:11px;font-weight:700;color:#8B877D;padding:5px 10px;">EN</span>
        </div>
        <div style="width:36px;height:36px;border-radius:999px;background:#DCEFC0;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:13px;font-weight:700;color:#457D1F;">FD</span>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:4px;">
      <h1 style="margin:0;font-size:26px;font-weight:800;color:#1C1B17;">Bonjour, Fatou</h1>
      <p style="margin:0;font-size:14px;color:#57544C;">Comment se passent vos JOJ aujourd'hui ?</p>
    </div>

    <div style="display:flex;align-items:center;gap:12px;background:#FBE2E1;border-radius:16px;padding:14px 16px;">
      <div style="width:36px;height:36px;border-radius:999px;background:#E5484D;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="#FFFFFF" stroke="none"/></svg>
      </div>
      <span style="font-size:14px;font-weight:700;color:#B5292D;flex-grow:1;">Signaler un problème urgent</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B5292D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </div>

  </div>

  <div style="flex-grow:1;overflow:hidden;padding:12px 20px 0;display:flex;flex-direction:column;gap:14px;">
    <span style="font-size:12px;font-weight:700;color:#8B877D;text-transform:uppercase;letter-spacing:0.04em;">Noter un service</span>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

      <div style="background:#FFFFFF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(28,27,23,0.04),0 8px 20px rgba(28,27,23,0.05);">
        <div style="width:44px;height:44px;border-radius:14px;background:#F3EFE4;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="10" rx="3"/><path d="M4 12h16"/><circle cx="8" cy="18.5" r="1.4"/><circle cx="16" cy="18.5" r="1.4"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:15px;font-weight:700;color:#1C1B17;">Transport</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="width:16px;height:16px;border-radius:999px;background:#E9F5DC;display:flex;align-items:center;justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5FA62C" stroke-width="2.6" stroke-linecap="round"><path d="M8 14.5q4 3.2 8 0"/></svg></div>
            <span style="font-size:11px;color:#8B877D;">Noté aujourd'hui</span>
          </div>
        </div>
      </div>

      <div style="background:#FFFFFF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(28,27,23,0.04),0 8px 20px rgba(28,27,23,0.05);">
        <div style="width:44px;height:44px;border-radius:14px;background:#F3EFE4;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7"/><path d="M3 19h18"/><path d="M5 10V7a2 2 0 0 1 2-2h3"/><path d="M9 12.5h4"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:15px;font-weight:700;color:#1C1B17;">Hébergement</span>
          <span style="font-size:11px;color:#8B877D;">Pas encore noté</span>
        </div>
      </div>

      <div style="background:#FFFFFF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(28,27,23,0.04),0 8px 20px rgba(28,27,23,0.05);">
        <div style="width:44px;height:44px;border-radius:14px;background:#F3EFE4;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M3.5 19c0-3 2-5 4.5-5s4.5 2 4.5 5"/><path d="M15 8.5c1.2.4 2 1.5 2 2.8s-.8 2.4-2 2.8"/><path d="M16 19c0-2.3-1.2-4.2-3-5"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:15px;font-weight:700;color:#1C1B17;">Accueil</span>
          <span style="font-size:11px;color:#8B877D;">Pas encore noté</span>
        </div>
      </div>

      <div style="background:#FFFFFF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(28,27,23,0.04),0 8px 20px rgba(28,27,23,0.05);">
        <div style="width:44px;height:44px;border-radius:14px;background:#F3EFE4;display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C1B17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:15px;font-weight:700;color:#1C1B17;">Sécurité</span>
          <span style="font-size:11px;color:#8B877D;">Pas encore noté</span>
        </div>
      </div>

    </div>
  </div>

  <div style="flex-shrink:0;display:flex;justify-content:center;padding:10px 20px 22px;border-top:1px solid #EFEBE0;background:#FFFFFF;">
    <div style="display:flex;width:100%;max-width:320px;justify-content:space-around;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div style="width:44px;height:32px;border-radius:12px;background:#EFF7E1;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5FA62C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 11 8-6 8 6"/><path d="M6 10v9h12v-9"/></svg>
        </div>
        <span style="font-size:11px;font-weight:700;color:#5FA62C;">Accueil</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div style="width:44px;height:32px;border-radius:12px;display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B877D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </div>
        <span style="font-size:11px;font-weight:600;color:#8B877D;">Historique</span>
      </div>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
