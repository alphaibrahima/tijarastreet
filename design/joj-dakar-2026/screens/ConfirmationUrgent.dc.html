<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #457D1F; text-decoration: underline; }
    a:hover { color: #2F5A15; }
  </style>
</helmet>

<div class="root" style="width:390px;height:844px;background:#FAF7F0;display:flex;flex-direction:column;overflow:hidden;">

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;">
    <div style="width:96px;height:96px;border-radius:999px;background:#1C1B17;display:flex;align-items:center;justify-content:center;">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;">
      <span style="font-size:24px;font-weight:800;color:#1C1B17;">Signalement transmis</span>
      <span style="font-size:13px;color:#8B877D;">Report submitted to the security team.</span>
    </div>
    <div style="background:#FBE2E1;border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B5292D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"></path><path d="M12 10v4"></path><circle cx="12" cy="17" r="0.6" fill="#B5292D" stroke="none"></circle></svg>
      <span style="font-size:13px;font-weight:700;color:#B5292D;">Sécurité — Urgent</span>
      <span style="font-size:11px;color:#B5292D;">· à l'instant</span>
    </div>
  </div>

  <div style="padding:0 32px 28px;">
    <div style="height:1px;background:#E4E0D6;margin-bottom:20px;"></div>
    <div style="display:flex;flex-direction:column;gap:10px;background:#F3EFE4;border-radius:16px;padding:16px;margin-bottom:20px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#57544C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5l3 2"></path></svg>
        <span style="font-size:12px;font-weight:700;color:#1C1B17;">Suivi</span>
      </div>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#57544C;">L'équipe sécurité a été alertée en temps réel. Vous retrouvez le statut de votre signalement dans votre historique. Même hors-ligne, il reste conservé et repart dès que le réseau revient.</p>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 0 20px 24px; align-self: auto; display: flex; justify-content: center; align-items: center">
    
  <button style="all: unset; display: flex; width: 100%; background: #1C1B17; color: #FFFFFF; font-size: 15px; font-weight: 700; padding: 16px; border-radius: 999px; position: static; justify-content: center; align-items: center; text-align: center" type="button">Retour à l'accueil</button></div>

</div>

</x-dc>
</body>
</html>
