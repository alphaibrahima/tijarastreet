<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #457D1F; text-decoration: underline; }
    a:hover { color: #2F5A15; }
  </style>
</helmet>

<div class="root" style="width:390px;height:844px;background:#FAF7F0;display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:28px 20px 0;display:flex;align-items:center;gap:14px;">
    <div style="width:36px;height:36px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(28,27,23,0.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;">
      <span style="font-size:16px;font-weight:700;color:#1C1B17;">Transport</span>
      <span style="font-size:12px;color:#8B877D;">Site de Dakar</span>
    </div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:20px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:20px;">
      <div style="width:88px;height:88px;border-radius:999px;background:#EFF7E1;display:flex;align-items:center;justify-content:center;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#5FA62C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="10" rx="3"/><path d="M4 12h16"/><circle cx="8" cy="18.5" r="1.4"/><circle cx="16" cy="18.5" r="1.4"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;">
        <span style="font-size:20px;font-weight:800;color:#1C1B17;">Comment évaluez-vous ce service ?</span>
        <span style="font-size:13px;color:#8B877D;">How would you rate this service?</span>
      </div>
    </div>

    <div style="display:flex;gap:14px;">

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:64px;border-radius:999px;background:#FBE2E1;display:flex;align-items:center;justify-content:center;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="8.7" cy="10.2" r="1" fill="#E5484D" stroke="none"/><circle cx="15.3" cy="10.2" r="1" fill="#E5484D" stroke="none"/><path d="M8 16.5q4-4.5 8 0"/></svg>
        </div>
        <span style="font-size:11px;font-weight:600;color:#57544C;">Insatisfait</span>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:64px;border-radius:999px;background:#FDF0C6;display:flex;align-items:center;justify-content:center;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B8790E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="8.7" cy="10.2" r="1" fill="#B8790E" stroke="none"/><circle cx="15.3" cy="10.2" r="1" fill="#B8790E" stroke="none"/><path d="M8 15h8"/></svg>
        </div>
        <span style="font-size:11px;font-weight:600;color:#57544C;">Moyen</span>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:76px;height:76px;border-radius:999px;background:#E9F5DC;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #5FA62C;transform:translateY(-6px);">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#5FA62C" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="8.7" cy="10.2" r="1" fill="#5FA62C" stroke="none"/><circle cx="15.3" cy="10.2" r="1" fill="#5FA62C" stroke="none"/><path d="M8 14.5q4 3.2 8 0"/></svg>
        </div>
        <span style="font-size:11px;font-weight:700;color:#457D1F;transform:translateY(-6px);">Satisfait</span>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:64px;border-radius:999px;background:#DCEFC0;display:flex;align-items:center;justify-content:center;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#457D1F" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7.6 9.6q1-1.1 2-0.1"/><path d="M14.4 9.6q1-1.1 2-0.1"/><path d="M7.5 14.2q4.5 4.3 9 0"/></svg>
        </div>
        <span style="font-size:11px;font-weight:600;color:#57544C;">Très satisfait</span>
      </div>

    </div>

  </div>

  <div style="flex-shrink:0;padding:0 20px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;">
    <button style="all:unset;width:100%;text-align:center;background:#7AC13B;color:#FFFFFF;font-size:16px;font-weight:700;padding:17px;border-radius:999px;box-shadow:0 8px 20px rgba(95,166,44,0.28);">Envoyer</button>
    <span style="font-size:11px;color:#8B877D;text-align:center;">Envoyé en moins de 2 secondes, même hors connexion.</span>
    <a href="#" style="font-size:12px;font-weight:600;color:#B5292D;text-decoration:none;">Un problème urgent plutôt ? Signaler</a>
  </div>

</div>

</x-dc>
</body>
</html>
