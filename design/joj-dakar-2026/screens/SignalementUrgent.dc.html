<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .root { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    a { color: #457D1F; text-decoration: underline; }
    a:hover { color: #2F5A15; }
    .chip { font-size:13px; font-weight:600; padding:10px 16px; border-radius:999px; }
  </style>
</helmet>

<div class="root" style="width:390px;height:844px;background:#FAF7F0;display:flex;flex-direction:column;overflow:hidden;">

  <div style="padding:28px 20px 0;display:flex;align-items:center;gap:14px;">
    <div style="width:36px;height:36px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(28,27,23,0.06);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1B17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </div>
    <span style="font-size:16px;font-weight:700;color:#1C1B17;">Signalement urgent</span>
  </div>

  <div style="flex-grow:1;overflow:hidden;padding:24px 20px 0;display:flex;flex-direction:column;gap:24px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;">
      <div style="width:64px;height:64px;border-radius:999px;background:#FBE2E1;display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="#E5484D" stroke="none"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:19px;font-weight:800;color:#1C1B17;">Décrivez le problème</span>
        <span style="font-size:12px;color:#8B877D;">Transmis immédiatement à l'équipe sécurité.</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:12px;font-weight:700;color:#57544C;">Catégorie concernée</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <span class="chip" style="background:#F3EFE4;color:#57544C;">Transport</span>
        <span class="chip" style="background:#F3EFE4;color:#57544C;">Hébergement</span>
        <span class="chip" style="background:#F3EFE4;color:#57544C;">Accueil</span>
        <span class="chip" style="background:#1C1B17;color:#FFFFFF;box-shadow:0 0 0 2px #E5484D;">Sécurité</span>
        <span class="chip" style="background:#F3EFE4;color:#57544C;">Autre</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:12px;font-weight:700;color:#57544C;">Précision (optionnel)</span>
      <div style="background:#F3EFE4;border-radius:16px;padding:14px 16px;min-height:96px;font-size:14px;line-height:1.5;color:#8B877D;">Portail d'accès mal éclairé côté livraisons...</div>
    </div>

  </div>

  <div style="flex-shrink:0;padding:0 20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;">
    <button style="all:unset;width:100%;text-align:center;background:#E5484D;color:#FFFFFF;font-size:16px;font-weight:700;padding:17px;border-radius:999px;box-shadow:0 8px 20px rgba(229,72,77,0.28);">Envoyer le signalement</button>
    <span style="font-size:11px;color:#8B877D;text-align:center;">Traité en priorité par l'équipe sécurité, même hors connexion.</span>
  </div>

</div>

</x-dc>
</body>
</html>
